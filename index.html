<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark"><meta name="description" content="멀티모달 AI 1–4강의 핵심을 워치용 터치 카드로 복습합니다."><title>멀티모달 AI · 워치 카드</title><style>
:root{--text:15px;--accent:#8bedc4;--muted:#92a5a5;--line:#263432}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#000;color:#edf4f1;font-family:'Malgun Gothic',Roboto,Arial,sans-serif;overscroll-behavior-x:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #8bedc4;outline-offset:2px}button:disabled{opacity:.22;cursor:default}button:active{background:#34574b!important}#app{position:relative;max-width:420px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#000}.bar{position:absolute;z-index:3;top:0;left:0;right:0;height:52px;padding:14px 16% 4px;display:flex;align-items:center;justify-content:space-between;gap:4px;background:linear-gradient(#000 82%,transparent)}.bar button{min-width:36px;min-height:32px;padding:3px 6px;background:#15211c;border-radius:16px;font-size:12px}.bar #counter{color:var(--muted);font-size:11px;white-space:nowrap;text-align:center}.bar .star{color:#a4eed0}.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding:54px 11% 76px;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}h1{font-size:24px;line-height:1.2;letter-spacing:-1px;text-align:center;margin:8px 0 13px}h1 span{display:block;font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;font-weight:normal}h2{font-size:18px;line-height:1.4;letter-spacing:-.4px;margin:0 0 14px;text-align:center;overflow-wrap:anywhere}.eyebrow{text-align:center;color:var(--accent);font-size:10px;margin:0 0 7px;letter-spacing:.7px}.intro{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin:4px 0 14px}.row{display:block;text-align:left;width:100%;background:#17201d;border:1px solid #24342b;border-radius:16px;padding:12px 14px;margin:7px 0;min-height:48px;line-height:1.35;font-size:15px;overflow-wrap:anywhere}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.row .count{float:right;color:var(--accent);font-size:10px;padding-top:3px}.row.primary{background:#153e2d;border-color:#397158;color:#c7ffe5}.row.item{font-size:14px}.row.saved{border-color:#92e6b7}.sectionlabel{font-size:11px;color:var(--muted);margin:17px 8px 8px}.body{font-size:var(--text);line-height:1.5;overflow-wrap:anywhere}.body p{margin:0 0 15px}.body b{color:#a0efc5;font-weight:700}.math{font-size:calc(var(--text) - 1px);line-height:1.8;background:#15251d;border-left:2px solid #7cdba4;border-radius:9px;padding:12px 9px;margin:9px 0 15px;overflow-wrap:anywhere;word-break:normal;cursor:zoom-in}.math.large{font-size:calc(var(--text) + 3px);cursor:zoom-out}sup,sub{font-size:.7em}.source{border-top:1px solid var(--line);color:#80928b;font-size:10px;line-height:1.55;padding-top:10px;margin:16px 0 8px}.hint{text-align:center;color:#73877e;font-size:10px;line-height:1.5;margin:10px 0}.nav{position:absolute;z-index:4;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:14px 22% 16px;background:linear-gradient(transparent,#000 24%)}.nav button{height:40px;flex:1;max-width:76px;border-radius:24px;background:#24372e;color:#bcf7d7;font-size:24px;line-height:1}.nav .label{font-size:12px}.nav:empty{display:none}.end{color:var(--accent);font-size:12px;text-align:center;margin-top:20px}.scrollcue{position:absolute;right:5%;top:49%;color:#537c67;font-size:14px;pointer-events:none}.desktop-note{display:none}.empty{font-size:14px;text-align:center;line-height:1.6;color:#99aca2;margin-top:30px}@media(max-width:230px){.bar{padding-left:15%;padding-right:15%}.screen{padding-left:11%;padding-right:11%}h2{font-size:16px;margin-bottom:10px}.body{line-height:1.46}.body p{margin-bottom:12px}.row{padding:10px 12px;font-size:14px}h1{font-size:21px}.math{padding:10px 8px}}@media(min-width:500px){body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#111916}#app{height:min(760px,94vh);border:1px solid #2c4137;border-radius:36px;box-shadow:0 25px 100px #000;width:420px}.bar{height:63px;padding-top:20px}.screen{padding-top:70px;padding-bottom:96px}.nav{bottom:25px}.desktop-note{display:block;position:fixed;bottom:5px;right:14px;color:#6b8576;font-size:11px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s}} 
</style></head><body><div id="app"><header class="bar"><button id="back" aria-label="목차로">목차</button><div id="counter">1–4강</div><button id="star" class="star" aria-label="즐겨찾기">☆</button></header><main class="screen" id="screen"></main><span class="scrollcue" aria-hidden="true">⌄</span><nav class="nav" id="nav" aria-label="카드 이동"></nav></div><div class="desktop-note">워치 크기에 맞춰 반응형 표시 · 키보드 ← → 이동</div><script>
const DATA=[{"id":"basics","title":"기초 개념","subtitle":"모달리티 · 기반 모델","cards":[{"title":"Modality","html":"<p>정보가 <b>표현·지각되는 방식</b>.</p><p>Raw: 픽셀·파형<br>Abstract: 객체·의미</p>","source":"1강 pp.4–7 / 2강 p.4"},{"title":"왜 멀티모달?","html":"<p>① 인간의 경험<br>② 실제 응용·인터넷<br>③ 데이터 확보·확장</p>","source":"1강 p.7"},{"title":"Foundation model","html":"<p><b>대규모 자기지도 사전학습</b> → 여러 downstream task에 적응.</p><p>단순히 큰 모델이라는 뜻은 아님.</p>","source":"1강 pp.8–9"},{"title":"Modality profile","html":"<p>앞부분 5성질: distribution, granularity, structure, information, noise.</p><p>p.17 종합 <b>6축</b>: 원소 표현·분포·구조·정보·잡음·<b>relevance</b>(과제·문맥).</p>","source":"2강 pp.11–17"},{"title":"BoW · 과제 단위","html":"<p><b>Bag-of-words는 단어 순서를 잃는다.</b></p><p>분류 = image<br>탐지 = region<br>분할 = pixel</p>","source":"2강 pp.6–7 / 3강 p.56"}]},{"id":"clip","title":"CLIP","subtitle":"구조 · 손실 · Zero-shot","cards":[{"title":"CLIP의 목표","html":"<p>Contrastive Language–Image Pre-training.</p><p><b>400M 이미지–텍스트 쌍</b>으로 짝을 맞춘다. 기본 목표는 캡션 생성이 아님.</p>","source":"2강 pp.23–36"},{"title":"두 인코더","html":"<p>이미지 → ViT/ResNet → 벡터 I</p><p>텍스트 → Transformer → 벡터 T</p><p><b>공통 임베딩 공간</b>에서 비교.</p>","source":"2강 pp.26–34"},{"title":"CLS vs EOT","html":"<p>ViT: patch → linear+위치 → 일반 attention → <b>CLS</b>.</p><p>Text: <b>causal attention · EOT</b>, context length 77.</p>","source":"2강 pp.28–29"},{"title":"유사도 S","html":"<div class=\"math\">S<sub>ij</sub> = I<sub>i</sub> · T<sub>j</sub> / τ</div><p>I,T는 L2 정규화. 내적 = cosine.</p><p><b>τ가 작으면</b> softmax가 더 뾰족.</p>","source":"2강 pp.31–34, 58"},{"title":"배치 N×N","html":"<p>행 = 이미지<br>열 = 텍스트</p><p><b>대각 양성 N개</b><br>음성 N(N−1)개</p><p>SimCLR 양성은 같은 이미지의 두 view.</p>","source":"2강 pp.31–34"},{"title":"이미지 → 텍스트 손실","html":"<p>한 행에서 짝인 텍스트를 고른다.</p><div class=\"math\">p<sub>i</sub> = exp(S<sub>ii</sub>)<br>÷ Σ<sub>j</sub> exp(S<sub>ij</sub>)<br><br>L<sub>I→T</sub> = −(1/N) Σ<sub>i</sub> log p<sub>i</sub></div>","source":"2강 pp.31–34, 58"},{"title":"텍스트 → 이미지 손실","html":"<p>한 열에서 짝인 이미지를 고른다.</p><div class=\"math\">q<sub>i</sub> = exp(S<sub>ii</sub>)<br>÷ Σ<sub>j</sub> exp(S<sub>ji</sub>)<br><br>L<sub>T→I</sub> = −(1/N) Σ<sub>i</sub> log q<sub>i</sub></div>","source":"2강 pp.31–34, 58"},{"title":"대칭 InfoNCE","html":"<div class=\"math\">L = ½(L<sub>I→T</sub> + L<sub>T→I</sub>)</div><p><b>행 CE + 열 CE의 평균.</b></p><p>모든 점수가 같으면 L=ln N. N=4 → 양성 4, 음성 12, L=ln4.</p>","source":"2강 pp.31–34, 58"},{"title":"Zero-shot","html":"<p>“a photo of a {class}” → 클래스 벡터 T<sub>k</sub>.</p><div class=\"math\">ŷ = argmax<sub>k</sub> I · T<sub>k</sub></div><p>텍스트 특징을 분류기 가중치처럼 사용.</p>","source":"2강 pp.37–41"},{"title":"평가 방식 3개","html":"<p><b>Zero-shot</b>: 타깃 라벨 추가 학습 없음.</p><p><b>Linear probe</b>: encoder 동결, head 학습.</p><p><b>Fine-tune</b>: encoder도 갱신.</p><p>여러 템플릿 평균 = prompt ensemble.</p>","source":"2강 pp.39–43"}]},{"id":"robust","title":"강건성 · SigLIP","subtitle":"원인 · 효율 · 한계","cards":[{"title":"강건성의 원인","html":"<p>Effective robustness: 원래 분포 성능을 감안한 shift 저항.</p><p>통제 실험의 핵심은 <b>학습 데이터 분포</b>. 언어 감독·규모·prompt·손실만으로 설명 X.</p>","source":"2강 pp.49–53"},{"title":"데이터 혼합","html":"<p>강건성은 <b>가산 X, 보간</b>.</p><div class=\"math\">R(YFCC)<br>&lt; R(혼합)<br>&lt; R(LAION)</div><p>큰 데이터가 항상 더 좋은 것은 아님.</p>","source":"2강 pp.54–56, 63"},{"title":"SigLIP 핵심","html":"<p>CLIP: 배치 후보 전체 softmax.</p><p><b>SigLIP: 쌍별 sigmoid 이진 손실.</b></p><p>전역 softmax 분모 없음 → 분할·분산 효율. <b>음성쌍은 여전히 필요.</b></p>","source":"2강 pp.58–61"},{"title":"SigLIP 수식","html":"<div class=\"math\">z<sub>ij</sub> = +1(짝), −1(비짝)<br>s<sub>ij</sub> = t I<sub>i</sub>·T<sub>j</sub> − b<br><br>L = (1/B) Σ<sub>i,j</sub><br>log[1+exp(−z<sub>ij</sub>s<sub>ij</sub>)]</div><p>t,b 학습 가능. b 부호는 원본 p.59 기준.</p>","source":"2강 p.59"},{"title":"장점과 한계","html":"<p><b>장점</b>: 싼 내적, 검색·확장, open vocabulary.</p><p>관계·세부 한계 → <b>hard negative</b>.</p><p>지역 정보 부족 → <b>region caption+box</b>.</p>","source":"2강 pp.69–72"},{"title":"후속 연구 이름","html":"<p><b>DataComp</b>: 데이터 필터 중요.</p><p><b>Meta CLIP 2</b>: 다국어 확장.</p><p><b>Perception Encoder</b>: 좋은 특징은 중간 층에도 존재.</p>","source":"2강 pp.62–67"}]},{"id":"prompt","title":"프롬프트 적응","subtitle":"CoOp → MaPLe → FLYP","cards":[{"title":"Engineering / Learning","html":"<p><b>Engineering</b>: 사람이 문구 선택.</p><p><b>Learning</b>: 연속 prompt 벡터 학습.</p><p>Frozen 가중치도 prompt까지의 <b>역전파 경로는 통과</b>한다.</p>","source":"3강 pp.8–11"},{"title":"CoOp","html":"<p>t<sub>k</sub>=[v₁…v<sub>M</sub>, CLASS<sub>k</sub>]</p><p><b>Text context만 학습</b>. Image/text encoder 동결.</p><p>고정 문맥. <b>Base에 과적합 → novel 일반화↓</b>.</p>","source":"3강 pp.10–18"},{"title":"CoOp 특징","html":"<p>긴 prompt의 이득은 체감.</p><p>학습 벡터를 자연어로 해석하기 어려움.</p><p><b>도메인 전이 ≠ novel class 일반화.</b></p>","source":"3강 pp.13–18"},{"title":"CoCoOp","html":"<div class=\"math\">π = h<sub>θ</sub>(f(x))<br>v<sub>m</sub>(x) = v<sub>m</sub> + π</div><p><b>이미지 특징 → Meta-Net → 조건부 문맥</b>.</p><p>Context+Meta-Net 학습, encoders 동결. Novel·전이↑, 이미지별 text encoding으로 느림.</p>","source":"3강 pp.19–24"},{"title":"Pixel prompt","html":"<p><b>입력 픽셀</b>에 task별 공통 패턴을 추가.</p><p>동일 prompt를 모든 test 이미지에 사용.</p><p>CLIP encoders 동결.</p>","source":"3강 pp.30–34"},{"title":"VPT","html":"<p><b>Embedding 토큰</b>에 prompt 삽입.</p><p>Shallow: 첫 층 입력만.<br>Deep: 여러 층 입력.</p><p>Backbone 동결, <b>prompt+task head 학습</b>.</p>","source":"3강 pp.35–36"},{"title":"MaPLe","html":"<p>Vision·language 양쪽 <b>deep prompts</b>.</p><div class=\"math\">P<sub>l</sub><sup>V</sup> = F<sub>l</sub>(P<sub>l</sub><sup>T</sup>)</div><p><b>Text prompt → vision prompt</b> 조건화. F=linear projection. Backbone 동결.</p>","source":"3강 pp.40–41"},{"title":"조건화 방향 비교","html":"<p><b>CoCoOp</b><br>이미지 → text prompt</p><p><b>MaPLe</b><br>language prompt → vision prompt</p><p>양쪽 적응 ≠ backbone 전체 학습.</p>","source":"3강 pp.20, 41"},{"title":"Tip-Adapter","html":"<p>Query = test feature<br>Key = few-shot features<br>Value = one-hot labels</p><p>유사도 기반 <b>cache logits + CLIP logits</b>.</p><p>Gradient 학습 없음. <b>Labeled data는 필요.</b></p>","source":"3강 p.48"},{"title":"Tip 수식","html":"<div class=\"math\">A = exp[−β(1−fFᵀ)]<br><br>logits = αAL<br>+ 기존 CLIP logits</div><p>α: cache 기여도<br>β: affinity 날카로움</p>","source":"3강 p.48"},{"title":"FLYP","html":"<p>Label → 자연어 caption.</p><p><b>Image+text encoder 전체</b>를 사전학습과 <b>같은 contrastive loss</b>로 FT.</p><p>Image+head class CE와의 목표 불일치를 줄임.</p>","source":"3강 pp.49–54"},{"title":"일반화 평가","html":"<p><b>Base→novel</b>: 같은 dataset, 새 클래스.</p><p><b>Cross-dataset</b>: 다른 dataset.</p><p><b>Domain generalization</b>: 같은 과제, 분포 변화.</p><div class=\"math\">HM = 2BN / (B+N)</div>","source":"3강 pp.43–47 / HM 보충식"}]},{"id":"vild","title":"개방형 탐지","subtitle":"ViLD · 손실 · 추론","cards":[{"title":"ViLD의 구조","html":"<p>Vision and Language Knowledge Distillation.</p><p><b>Class-agnostic localization</b> + <b>언어 기반 classification</b>.</p><p>새 클래스마다 재학습 없이 텍스트로 탐지 범주 변경.</p>","source":"3강 pp.55–60"},{"title":"ViLD 손실 비교","html":"<p><b>ViLD-Text</b>: region ↔ base text, <b>CE</b>.</p><p><b>ViLD-Image</b>: region이 CLIP crop feature를 모방, <b>L1 distillation</b>.</p><p><b>L2는 정규화</b>, L1은 손실.</p>","source":"3강 pp.59–60"},{"title":"ViLD 추론·평가","html":"<p>Region ↔ base+novel text 비교.</p><p>새 카테고리 = <b>text embeddings 교체</b>.</p><p>LVIS rare=novel, 지표 <b>AP<sub>r</sub></b>. 색·속성으로 어휘 확장.</p>","source":"3강 pp.61–64"},{"title":"이름만 연결","html":"<p><b>Learning to Name Classes</b>: 클래스 이름 표현 최적화.</p><p><b>HPS v2</b>: 생성 이미지의 사람 선호를 학습·예측·평가.</p>","source":"3강 pp.25, 65"}]},{"id":"lm","title":"Transformer","subtitle":"마스크 · 토큰화","cards":[{"title":"Transformer layer","html":"<p><b>Attention + FFN<br>+ LayerNorm + residual</b></p><p>Decoder는 causal mask로 미래 누출 차단.</p>","source":"4강 pp.6–9"},{"title":"Causal mask","html":"<div class=\"math\">A = softmax(QKᵀ/√d<sub>k</sub> + M)V<br><br>M<sub>ij</sub> = 0 (j≤i)<br>M<sub>ij</sub> = −∞ (j&gt;i)</div><p><b>−∞ → 확률 0</b>.<br>Score 0만 넣으면 확률이 남는다.</p>","source":"4강 p.9 / attention 표준식 보충"},{"title":"Autoregressive","html":"<div class=\"math\">p(x<sub>1:T</sub>)<br>= ∏<sub>t</sub> p(x<sub>t</sub>|x<sub>&lt;t</sub>)</div><p>학습: mask로 병렬.<br>생성: 토큰마다 순차.</p><p>Greedy의 매번 최고 ≠ 전체 문장 확률 최고.</p>","source":"4강 pp.10–13"},{"title":"ID vs embedding","html":"<p>문자열 → tokenizer → <b>정수 ID</b> → embedding lookup → LM.</p><div class=\"math\">E ∈ ℝ<sup>d × |V|</sup><br>파라미터 = d|V|</div><p>ID는 의미 벡터가 아니라 사전 인덱스.</p>","source":"4강 pp.15–24"},{"title":"토큰화 절충","html":"<p>큰 단위: 시퀀스↓ / 어휘↑.</p><p><b>Subword</b>: word 효율 + character coverage 절충. 항상 형태소는 아님.</p><p>Zipf: 빈도 ∝ 1/순위.</p>","source":"4강 pp.25–27"}]},{"id":"llava","title":"MLLM · LLaVA","subtitle":"데이터 · 특징 · 학습","cards":[{"title":"MLLM 3요소","html":"<p><b>Vision encoder<br>→ connector<br>→ LLM</b></p><p>+ visual instruction 데이터.</p><p>시각 정보를 조건으로 언어 답변을 생성.</p>","source":"4강 pp.30–33, 55"},{"title":"합성 instruction","html":"<p>Caption + 객체·box 텍스트 → <b>text-only GPT</b> → 지시·답 생성.</p><p>원본 이미지와 묶어 <b>(image, instruction, answer)</b>.</p><p>GPT가 raw pixel을 직접 보는 방식 X.</p>","source":"4강 pp.40–43"},{"title":"왜 instruction tuning?","html":"<p>Next-token 사전학습은 문장 완성.</p><p>사용자 지시 이행과 목적이 다르므로 <b>instruction-output 데이터</b>로 적응.</p>","source":"4강 pp.35–39"},{"title":"Penultimate patch","html":"<p>CLIP-ViT-L/14의 <b>끝에서 두 번째 층 patch</b> → projector → LLM.</p><p>최종 CLS는 전역 정렬. 최종 patch output은 직접 대조 감독 부족.</p><p><b>공간·세부 정보 보존.</b></p>","source":"4강 pp.49–55"},{"title":"Projector · Stage 1","html":"<p>초기 LLaVA: linear.<br>LLaVA-1.5: MLP.</p><p><b>Stage 1: feature alignment</b><br>Vision 동결<br>Projector 학습<br>LLM 동결</p><p>595K image-text pairs.</p>","source":"4강 pp.55–56"},{"title":"Stage 2","html":"<p><b>Visual instruction tuning</b></p><p>Vision <b>계속 동결</b><br>Projector 학습<br>LLM 학습</p><p>158K: 대화58K / 묘사23K / 추론77K.</p>","source":"4강 pp.43, 57"},{"title":"LLaVA 손실","html":"<div class=\"math\">L = −Σ<sub>t</sub> log p(a<sub>t</sub> |<br>image, instruction, a<sub>&lt;t</sub>)</div><p><b>답변 언어 토큰</b>의 AR loss.</p><p>이미지 patch 복원 X.<br>Stage2 “end-to-end”여도 vision 동결.</p>","source":"4강 pp.54–57"}]},{"id":"vision","title":"시각 개선","subtitle":"Encoder · 토큰 · SoM","cards":[{"title":"Vision의 3문제","html":"<p>① 어떤 <b>encoder</b>?<br>② 많은 <b>tokens</b> 처리?<br>③ 어떻게 <b>visual prompt</b>?</p><p>강의의 이해 실험에서는 CLIP/SigLIP가 유리.</p>","source":"4강 pp.61–70"},{"title":"고해상도 · VCoder","html":"<p><b>Multi-crop</b>: 고정 크기 encoder로 local crops+global image 처리.</p><p>576 → 최대2880 tokens. 세부↑ / 비용↑.</p><p><b>VCoder</b>: segmentation·depth 추가.</p>","source":"4강 pp.71–73"},{"title":"CLIP-blind pair","html":"<div class=\"math\">CLIP cosine &gt; 0.95<br>DINOv2 cosine &lt; 0.6</div><p>이 차이로 <b>MMVP</b> 구성.</p><p>CLIP은 의미에 강하나 방향·수·배치를 놓칠 수 있음.</p>","source":"4강 pp.74–76"},{"title":"MoF","html":"<p><b>Mixture-of-Features</b>: CLIP+DINOv2의 상보적 특징.</p><p>I-MoF로 세부 정보 보완.</p><p><b>단독 성능 ≠ 혼합 시 기여.</b></p>","source":"4강 pp.77–78"},{"title":"토큰 비용","html":"<p>이미지당 수백~수천 토큰, 비디오는 프레임마다 누적.</p><div class=\"math\">Self-attention O(L²)</div><p>정보를 보존하면서 토큰 수를 줄인다.</p>","source":"4강 pp.79–82"},{"title":"Q-Former vs concat","html":"<p><b>Q-Former</b>: 정한 수의 query로 시각 정보를 읽어 압축.</p><p><b>Concat→projection</b>: 인접한 토큰 <b>4개 → 1개</b>.</p>","source":"4강 p.80"},{"title":"PruMerge","html":"<p>① 중요 token sample<br>② kNN cluster<br>③ <b>weighted average</b>로 병합</p><p><b>토큰 25%만 사용</b> = 75% 감소. 25% 감소가 아님.</p>","source":"4강 pp.81–82"},{"title":"UI graph","html":"<p>UI는 구조·중복이 많음.</p><p>ShowUI: graph로 <b>token selection</b>.</p><p>클릭하려면 <b>원래 위치 관계 보존</b>. 원본에서 merging은 취소선.</p>","source":"4강 pp.83–86"},{"title":"SoM 두 조건","html":"<p><b>Set-of-Mark</b></p><p>① 의미 있는 region 분할 → <b>grounding</b></p><p>② 모델이 해석하고 <b>말로 지칭 가능한 mark</b></p>","source":"4강 pp.90–92"},{"title":"SoM 생성 순서","html":"<p>도구: SEEM / Semantic-SAM / SAM.</p><p>작은 → 큰 region 순서로 overlay. <b>이전 region은 제외</b>.</p><p>가중치 학습보다 <b>입력 표시 방식</b>.</p>","source":"4강 pp.93–94"}]}];const flat=DATA.flatMap((g,gi)=>g.cards.map((c,ci)=>({...c,gi,ci,id:g.id+'-'+ci})));let screen='home',gi=0,ci=0;let favorites=[],font=15,last=null;
try{favorites=JSON.parse(localStorage.getItem('mmw-stars')||'[]');font=Number(localStorage.getItem('mmw-font'))||15;last=JSON.parse(localStorage.getItem('mmw-last')||'null')}catch(e){}font=[15,17,19].includes(font)?font:15;document.documentElement.style.setProperty('--text',font+'px');
const main=document.getElementById('screen'),counter=document.getElementById('counter'),star=document.getElementById('star'),nav=document.getElementById('nav'),back=document.getElementById('back');
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cardId(){return DATA[gi].id+'-'+ci}function resetScroll(){main.scrollTop=0}function row(text,sub,action,cls=''){return '<button class="row '+cls+'" data-action="'+action+'">'+text+(sub?'<small>'+sub+'</small>':'')+'</button>'}
function render(){star.style.visibility=screen==='card'?'visible':'hidden';back.textContent=screen==='home'?'글자':'목차';back.setAttribute('aria-label',screen==='home'?'글자 크기 변경':'목차로');nav.innerHTML='';resetScroll();
if(screen==='home'){counter.textContent='1–4강 · '+flat.length;main.innerHTML='<h2>멀티모달 AI</h2><p class="intro">주제 터치 · 좌우로 넘기기</p>'+(last&&DATA[last.gi]?.cards[last.ci]?row('이어보기',esc(DATA[last.gi].title+' · '+DATA[last.gi].cards[last.ci].title),'resume','primary'):'')+DATA.map((g,i)=>row('<span class="count">'+g.cards.length+'</span>'+esc(g.title),esc(g.subtitle),'group:'+i)).join('')+row('★ 즐겨찾기',favorites.length+'개 저장','favorites')+'<p class="hint">글자 크기: '+font+'px<br>왼쪽 위 ‘글자’를 눌러 조절<br>수식은 터치하면 확대됩니다.</p><p class="source">박관용 멀티모달 AI 1–4강<br>기존 단일 페이퍼 기반 요약</p>';nav.innerHTML='';
}else if(screen==='group'){const g=DATA[gi];counter.textContent=g.cards.length+'개';main.innerHTML='<div class="eyebrow">주제 목차</div><h2>'+esc(g.title)+'</h2>'+g.cards.map((c,i)=>row((favorites.includes(g.id+'-'+i)?'★ ':'')+esc(c.title),'','card:'+gi+':'+i,'item')).join('');nav.innerHTML='<button class="label" data-action="home">전체 목차</button>';
}else if(screen==='favorites'){counter.textContent=favorites.length+'개';main.innerHTML='<div class="eyebrow">BOOKMARKS</div><h2>즐겨찾기</h2>'+ (favorites.length?flat.filter(c=>favorites.includes(c.id)).map(c=>row(esc(c.title),esc(DATA[c.gi].title),'card:'+c.gi+':'+c.ci,'item saved')).join(''):'<p class="empty">카드 오른쪽 위 ☆를<br>누르면 여기에 저장됩니다.</p>');nav.innerHTML='<button class="label" data-action="home">전체 목차</button>';
}else{const g=DATA[gi],c=g.cards[ci];counter.textContent=(ci+1)+' / '+g.cards.length;star.textContent=favorites.includes(cardId())?'★':'☆';star.setAttribute('aria-pressed',favorites.includes(cardId()));main.innerHTML='<div class="eyebrow">'+esc(g.title)+'</div><h2>'+esc(c.title)+'</h2><article class="body">'+c.html+'</article><p class="source">'+esc(c.source)+'</p><p class="hint">수식 터치: 확대 / 재터치: 복원<br>좌우: 이전·다음 카드</p>';const n=flat.findIndex(v=>v.id===cardId());nav.innerHTML='<button data-action="prev" aria-label="이전 카드" '+(n===0?'disabled':'')+'>‹</button><button data-action="next" aria-label="다음 카드" '+(n===flat.length-1?'disabled':'')+'>›</button>';last={gi,ci};save('mmw-last',last);}
main.querySelectorAll('.math').forEach(m=>{m.setAttribute('role','button');m.setAttribute('tabindex','0');m.setAttribute('aria-label','수식 확대 또는 축소');m.onclick=()=>m.classList.toggle('large');m.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();m.click()}}});}
function openCard(g,c){gi=g;ci=c;screen='card';render()}function move(delta){if(screen!=='card')return;const n=flat.findIndex(c=>c.id===cardId())+delta;if(n>=0&&n<flat.length)openCard(flat[n].gi,flat[n].ci)}function changeFont(){font=font===15?17:font===17?19:15;document.documentElement.style.setProperty('--text',font+'px');save('mmw-font',font);if(screen==='home')render();}
function act(a){const p=a.split(':');if(p[0]==='group'){gi=+p[1];screen='group';render()}else if(p[0]==='card')openCard(+p[1],+p[2]);else if(a==='resume'&&last)openCard(last.gi,last.ci);else if(a==='home'){screen='home';render()}else if(a==='favorites'){screen='favorites';render()}else if(a==='prev')move(-1);else if(a==='next')move(1);else if(a==='font')changeFont()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action)});back.onclick=()=>{if(screen==='home')changeFont();else if(screen==='card'){screen='group';render()}else{screen='home';render()}};star.onclick=()=>{if(screen!=='card')return;const id=cardId();favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('mmw-stars',favorites);star.textContent=favorites.includes(id)?'★':'☆';star.setAttribute('aria-pressed',favorites.includes(id))};
let touch=null;main.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY,interactive:!!e.target.closest('button,.math')};else touch=null},{passive:true});main.addEventListener('touchend',e=>{if(!touch||touch.interactive||screen!=='card')return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.8)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key==='Escape')back.click()});render();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
