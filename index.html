:root{--text:15px;--accent:#8bedc4;--muted:#92a5a5;--line:#263432}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#000;color:#edf4f1;font-family:'Malgun Gothic',Roboto,Arial,sans-serif;overscroll-behavior-x:none}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid #8bedc4;outline-offset:2px}button:disabled{opacity:.22;cursor:default}button:active{background:#34574b!important}#app{position:relative;max-width:420px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#000}.bar{position:absolute;z-index:3;top:0;left:0;right:0;height:52px;padding:14px 16% 4px;display:flex;align-items:center;justify-content:space-between;gap:4px;background:linear-gradient(#000 82%,transparent)}.bar button{min-width:36px;min-height:32px;padding:3px 6px;background:#15211c;border-radius:16px;font-size:12px}.bar #counter{color:var(--muted);font-size:11px;white-space:nowrap;text-align:center}.bar .star{color:#a4eed0}.screen{height:100%;overflow-y:auto;overflow-x:hidden;padding:54px 11% 76px;scrollbar-width:none;touch-action:pan-y;-webkit-overflow-scrolling:touch}.screen::-webkit-scrollbar{display:none}h1{font-size:24px;line-height:1.2;letter-spacing:-1px;text-align:center;margin:8px 0 13px}h1 span{display:block;font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;font-weight:normal}h2{font-size:18px;line-height:1.4;letter-spacing:-.4px;margin:0 0 14px;text-align:center;overflow-wrap:anywhere}.eyebrow{text-align:center;color:var(--accent);font-size:10px;margin:0 0 7px;letter-spacing:.7px}.intro{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin:4px 0 14px}.row{display:block;text-align:left;width:100%;background:#17201d;border:1px solid #24342b;border-radius:16px;padding:12px 14px;margin:7px 0;min-height:48px;line-height:1.35;font-size:15px;overflow-wrap:anywhere}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.row .count{float:right;color:var(--accent);font-size:10px;padding-top:3px}.row.primary{background:#153e2d;border-color:#397158;color:#c7ffe5}.row.item{font-size:14px}.row.saved{border-color:#92e6b7}.sectionlabel{font-size:11px;color:var(--muted);margin:17px 8px 8px}.body{font-size:var(--text);line-height:1.5;overflow-wrap:anywhere}.body p{margin:0 0 17px}.question{font-size:13px;line-height:1.55;background:#13271c;border:1px solid #2e513c;border-radius:12px;padding:11px 10px;margin:0 0 15px;overflow-wrap:anywhere}.question span{display:block;font-size:10px;letter-spacing:.6px;color:#85c7a3;margin-bottom:5px}.answer-label,.formula-label{font-size:11px;color:#8bedc4;margin:12px 0 8px}.body{word-break:normal}.body b{color:#a0efc5;font-weight:700}.math{font-size:calc(var(--text) - 1px);line-height:1.8;background:#15251d;border-left:2px solid #7cdba4;border-radius:9px;padding:12px 9px;margin:9px 0 15px;overflow-wrap:anywhere;word-break:normal;cursor:zoom-in}.math.large{font-size:calc(var(--text) + 3px);cursor:zoom-out}sup,sub{font-size:.7em}.source{border-top:1px solid var(--line);color:#80928b;font-size:10px;line-height:1.55;padding-top:10px;margin:16px 0 8px}.hint{text-align:center;color:#73877e;font-size:10px;line-height:1.5;margin:10px 0}.nav{position:absolute;z-index:4;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:14px 22% 16px;background:linear-gradient(transparent,#000 24%)}.nav button{height:40px;flex:1;max-width:76px;border-radius:24px;background:#24372e;color:#bcf7d7;font-size:24px;line-height:1}.nav .label{font-size:12px}.nav:empty{display:none}.end{color:var(--accent);font-size:12px;text-align:center;margin-top:20px}.scrollcue{position:absolute;right:5%;top:49%;color:#537c67;font-size:14px;pointer-events:none}.desktop-note{display:none}.empty{font-size:14px;text-align:center;line-height:1.6;color:#99aca2;margin-top:30px}@media(max-width:230px){.bar{padding-left:15%;padding-right:15%}.screen{padding-left:11%;padding-right:11%}h2{font-size:16px;margin-bottom:10px}.body{line-height:1.46}.body p{margin-bottom:12px}.row{padding:10px 12px;font-size:14px}h1{font-size:21px}.math{padding:10px 8px}}@media(min-width:500px){body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#111916}#app{height:min(760px,94vh);border:1px solid #2c4137;border-radius:36px;box-shadow:0 25px 100px #000;width:420px}.bar{height:63px;padding-top:20px}.screen{padding-top:70px;padding-bottom:96px}.nav{bottom:25px}.desktop-note{display:block;position:fixed;bottom:5px;right:14px;color:#6b8576;font-size:11px}}@media(prefers-reduced-motion:no-preference){button{transition:background .12s}} 
</style></head><body><div id="app"><header class="bar"><button id="back" aria-label="목차로">목차</button><div id="counter">1–4강</div><button id="star" class="star" aria-label="즐겨찾기">☆</button></header><main class="screen" id="screen"></main><span class="scrollcue" aria-hidden="true">⌄</span><nav class="nav" id="nav" aria-label="카드 이동"></nav></div><div class="desktop-note">워치 크기에 맞춰 반응형 표시 · 키보드 ← → 이동</div><script>
const DATA=[{"id":"basics","title":"기초 개념","subtitle":"모달리티 · 기반 모델","cards":[{"title":"Modality","html":"<p>Modality란 정보가 표현되거나 지각되는 방식을 의미한다. 이미지, 음성, 텍스트는 동일한 대상을 서로 다른 형식으로 나타내는 모달리티의 예이다.</p><p>Raw modality는 픽셀이나 음성 파형처럼 센서에 가까운 원시 신호이고, abstract modality는 객체 범주나 감정처럼 원시 신호를 해석해 얻은 추상적 표현이다. AI의 표현학습은 원시 데이터에서 과제에 유용한 추상적 특징을 학습하는 과정이라고 설명할 수 있다.</p>","source":"1강 pp.4–7 / 2강 p.4","question":"Modality의 의미와 raw modality·abstract modality의 차이를 설명하시오."},{"title":"왜 멀티모달?","html":"<p>멀티모달 AI가 필요한 첫 번째 이유는 인간의 경험과 관찰이 시각, 청각, 언어 등 여러 모달리티로 이루어져 있기 때문이다. 여러 모달리티를 함께 다루면 이러한 실제 경험을 더 충실하게 모델링할 수 있다.</p><p>두 번째로 인터넷과 실제 응용에는 이미지와 설명문처럼 서로 연결된 다양한 데이터가 존재한다. 이러한 데이터를 활용하면 실제 문제를 폭넓게 처리할 수 있고, 대규모 학습 데이터를 확보하고 확장하는 데에도 유리하다.</p>","source":"1강 p.7","question":"멀티모달 AI가 필요한 이유를 설명하시오."},{"title":"Foundation model","html":"<p>Foundation model은 대규모 데이터로 사전학습한 뒤 다양한 downstream task에 적응시켜 사용할 수 있는 기반 모델이다. 강의에서는 대규모 자기지도학습과 범용적이고 확장 가능한 신경망 구조를 중요한 특징으로 제시한다.</p><p>단일 과제 모델이 특정 입력과 출력에 맞추어 학습되는 것과 달리, foundation model은 사전학습으로 얻은 표현과 지식을 여러 과제에서 재사용한다. 따라서 단순히 파라미터 수가 큰 모델이 아니라, 대규모 사전학습과 폭넓은 전이 가능성을 가진 모델이라는 점이 핵심이다.</p>","source":"1강 pp.8–9","question":"Foundation model을 정의하고 일반적인 단일 과제 모델과의 차이를 설명하시오."},{"title":"Modality profile","html":"<p>Modality profile은 특정 모달리티에 고유한 데이터의 성질과 구조를 나타낸다. 강의의 초기 설명은 분포, 세밀함 또는 샘플링 단위, 구조, 정보량, 잡음이라는 다섯 성질을 사용한다.</p><p>종합표에서는 원소 표현, 원소 분포, 구조, 정보, 잡음, 과제·문맥 관련성의 여섯 축으로 정리한다. 예를 들어 이미지와 문장은 원소의 형태, 공간적·순차적 구조, 정보 밀도와 잡음 양상이 다르므로 같은 차원의 벡터로 바꾸는 것만으로 의미 대응이 보장되지 않는다.</p>","source":"2강 pp.11–17","question":"서로 다른 모달리티의 이질성을 modality profile로 설명하시오."},{"title":"BoW · 과제 단위","html":"<p>Bag-of-words는 문서를 단어의 등장 여부나 빈도로 표현하므로 단어의 순서와 관계를 보존하지 못한다. 따라서 같은 단어를 포함하더라도 어순이나 관계가 달라 의미가 다른 문장을 구분하기 어렵다.</p><p>시각 과제의 출력 단위도 구분해야 한다. 이미지 분류는 이미지 전체의 범주를 예측하고, 객체 탐지는 객체의 영역과 범주를 예측하며, 분할은 픽셀 수준에서 범주나 영역을 구분한다. 즉 분류, 탐지, 분할은 각각 image, region, pixel 수준의 과제이다.</p>","source":"2강 pp.6–7 / 3강 p.56","question":"Bag-of-words의 한계와 분류·탐지·분할의 출력 단위를 설명하시오."}]},{"id":"clip","title":"CLIP","subtitle":"구조 · 손실 · Zero-shot","cards":[{"title":"CLIP의 목표","html":"<p>CLIP은 Contrastive Language–Image Pre-training의 약자로, 이미지와 연결된 텍스트를 이용하여 두 모달리티의 표현을 정렬하는 모델이다. 약 4억 개의 이미지–텍스트 쌍을 사용하여 실제로 대응하는 쌍의 유사도가 다른 조합보다 높아지도록 학습한다.</p><p>이때 목표는 이미지의 캡션을 단어별로 생성하는 것이 아니라 배치 안에서 올바른 이미지–텍스트 짝을 찾는 것이다. 과제별로 사람이 만든 고정 클래스 라벨 대신 웹의 자연어 설명을 감독으로 활용하므로, 학습 후 새로운 범주도 텍스트로 지정하여 인식할 수 있다.</p>","source":"2강 pp.23–36","question":"CLIP의 학습 목표와 자연어 감독의 의미를 설명하시오."},{"title":"두 인코더","html":"<p>CLIP은 이미지 인코더와 텍스트 인코더를 분리한 dual-encoder 구조를 사용한다. 이미지 인코더는 이미지에서 시각 특징을 추출하고, 텍스트 인코더는 문장을 언어 특징으로 변환한다.</p><p>두 특징을 같은 차원의 공간으로 투영하고 정규화한 뒤 내적 또는 cosine similarity로 대응 정도를 계산한다. 대조학습을 통해 실제 짝의 표현은 가깝게, 배치의 비대응 조합은 구별되게 만들므로 서로 다른 입력 형식도 공통 공간에서 비교할 수 있다.</p>","source":"2강 pp.26–34","question":"CLIP의 dual-encoder 구조와 표현 정렬 과정을 설명하시오."},{"title":"CLS vs EOT","html":"<p>ViT 이미지 인코더는 이미지를 패치로 나누고, 각 패치를 선형 투영한 뒤 위치 임베딩과 함께 Transformer에 입력한다. 일반 self-attention을 수행하고, 이미지 전체를 대표하는 CLS 출력으로 전역 특징을 얻는다.</p><p>텍스트 인코더는 텍스트를 토큰화하여 토큰 임베딩과 위치 정보를 입력하고 causal attention을 사용한다. 강의의 CLIP 설정은 문맥 길이가 77이며, 문장 끝을 나타내는 EOT 출력으로 텍스트 특징을 얻는다. 텍스트 인코더에 causal mask를 쓰더라도 CLIP의 학습 목표 자체는 문장 생성이 아니라 이미지–텍스트 대조학습이다.</p>","source":"2강 pp.28–29","question":"CLIP의 이미지·텍스트 인코더에서 입력 토큰과 대표 특징을 어떻게 얻는지 설명하시오."},{"title":"유사도 S","html":"<p>CLIP은 이미지 특징과 텍스트 특징을 L2 정규화한 뒤 내적을 계산한다. 정규화된 두 벡터의 내적은 cosine similarity와 같으므로, 벡터의 크기보다 방향을 기준으로 의미적 대응 정도를 비교한다.</p><p>이 유사도를 temperature τ로 나누어 softmax에 입력한다. τ가 작을수록 점수 차이가 확대되어 분포가 뾰족해지고, τ가 클수록 상대적으로 완만해진다. 따라서 temperature는 양성쌍과 음성쌍을 구별하는 확률 분포의 날카로움을 조절한다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">S<sub>ij</sub> = I<sub>i</sub> · T<sub>j</sub> / τ</div>","source":"2강 pp.31–34, 58","question":"CLIP의 유사도 계산에서 정규화와 temperature의 역할을 설명하시오."},{"title":"배치 N×N","html":"<p>배치에 N개의 이미지–텍스트 대응 쌍이 있으면 모든 이미지와 모든 텍스트를 비교하여 N×N 유사도 행렬을 만든다. 행을 이미지, 열을 텍스트로 두면 같은 인덱스의 대각선 N개가 실제 양성쌍이다.</p><p>나머지 N(N−1)개 조합은 배치 내 음성쌍으로 취급된다. 각 이미지에는 N−1개의 텍스트 음성이, 각 텍스트에는 N−1개의 이미지 음성이 존재한다. CLIP은 이미지–텍스트를 양성으로 사용하는 반면, SimCLR은 같은 이미지의 서로 다른 augmentation view를 양성으로 사용한다.</p>","source":"2강 pp.31–34","question":"CLIP의 N×N 유사도 행렬과 양성·음성쌍의 의미를 설명하시오."},{"title":"이미지 → 텍스트 손실","html":"<p>이미지→텍스트 손실은 하나의 이미지를 기준으로 배치의 N개 텍스트 중 실제로 대응하는 텍스트를 선택하는 분류 문제이다. 따라서 이미지 i에 해당하는 유사도 행렬의 i번째 행에 softmax를 적용한다.</p><p>정답 확률의 분자는 exp(Sᵢᵢ)이고 분모는 그 이미지와 모든 텍스트의 점수를 지수화하여 합한 값이다. 정답 확률의 음의 로그를 이미지별로 계산하여 평균하면 cross-entropy 손실이 된다. 이를 최소화하면 정답 텍스트가 다른 후보보다 높은 상대 점수를 갖도록 학습된다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">p<sub>i</sub> = exp(S<sub>ii</sub>)<br>÷ Σ<sub>j</sub> exp(S<sub>ij</sub>)<br><br>L<sub>I→T</sub> = −(1/N) Σ<sub>i</sub> log p<sub>i</sub></div>","source":"2강 pp.31–34, 58","question":"CLIP의 이미지→텍스트 손실은 무엇을 분류하며 어떻게 계산되는가?"},{"title":"텍스트 → 이미지 손실","html":"<p>텍스트→이미지 손실은 하나의 텍스트를 기준으로 배치의 N개 이미지 중 대응하는 이미지를 선택하는 문제이다. 이미지→텍스트가 행 방향으로 정규화하는 것과 달리, 텍스트→이미지는 유사도 행렬의 열 방향으로 정규화한다.</p><p>텍스트 i의 정답 점수는 Sᵢᵢ이고, 분모에는 모든 이미지 j와 해당 텍스트 i의 점수 Sⱼᵢ가 들어간다. 정답 확률에 대한 음의 로그를 텍스트별로 평균함으로써 텍스트에서 이미지를 찾는 방향의 정렬도 학습한다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">q<sub>i</sub> = exp(S<sub>ii</sub>)<br>÷ Σ<sub>j</sub> exp(S<sub>ji</sub>)<br><br>L<sub>T→I</sub> = −(1/N) Σ<sub>i</sub> log q<sub>i</sub></div>","source":"2강 pp.31–34, 58","question":"CLIP의 텍스트→이미지 손실이 이미지→텍스트 손실과 다른 점을 설명하시오."},{"title":"대칭 InfoNCE","html":"<p>CLIP의 최종 손실은 이미지→텍스트 손실과 텍스트→이미지 손실의 평균이다. 한쪽 방향의 짝 찾기만 학습하는 것이 아니라, 두 방향 모두에서 실제 대응 쌍의 점수가 상대적으로 높아지도록 공통 표현 공간을 정렬하기 위해서이다.</p><p>모든 후보의 점수가 같으면 각 방향에서 정답 확률은 1/N이므로 cross-entropy는 ln N이다. 두 방향을 더한 뒤 2로 나누므로 최종 손실 역시 ln N이다. 예를 들어 N=4이면 양성쌍은 4개, 음성쌍은 12개이고 균일 점수의 손실은 ln 4이다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">L = ½(L<sub>I→T</sub> + L<sub>T→I</sub>)</div>","source":"2강 pp.31–34, 58","question":"CLIP이 양방향 대칭 InfoNCE 손실을 사용하는 이유와 균일 점수일 때의 손실을 설명하시오."},{"title":"Zero-shot","html":"<p>먼저 분류할 클래스 이름을 “a photo of a {class}”와 같은 문장에 넣어 클래스별 텍스트를 만든다. 이를 텍스트 인코더로 변환한 특징은 해당 클래스의 분류기 가중치처럼 사용할 수 있다.</p><p>테스트 이미지의 특징과 각 클래스의 텍스트 특징 사이 유사도를 계산하고 가장 높은 클래스를 선택한다. 목표 데이터셋의 라벨로 별도의 분류기를 학습하지 않기 때문에 zero-shot이며, 후보 클래스는 텍스트를 바꾸어 지정할 수 있다. 다만 이는 사전학습 자체를 하지 않았다는 의미는 아니다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">ŷ = argmax<sub>k</sub> I · T<sub>k</sub></div>","source":"2강 pp.37–41","question":"CLIP으로 새로운 클래스에 대한 zero-shot 분류를 수행하는 과정을 설명하시오."},{"title":"평가 방식 3개","html":"<p>Zero-shot은 목표 과제의 라벨로 추가 학습하지 않고 사전학습 모델과 텍스트 클래스 표현을 이용한다. Linear probing은 인코더를 동결하고 라벨로 선형 분류기만 학습하므로, 고정된 표현 자체의 품질을 평가하기에 적합하다.</p><p>Fine-tuning은 분류기뿐 아니라 인코더의 일부 또는 전체 파라미터도 갱신하여 새 과제에 적응한다. 한편 prompt ensemble은 같은 클래스를 여러 템플릿으로 표현한 뒤 텍스트 임베딩을 평균하여 분류에 사용하는 방법이다. 따라서 학습 방식과 프롬프트 구성 방식은 구분해서 설명해야 한다.</p>","source":"2강 pp.39–43","question":"Zero-shot, linear probing, fine-tuning을 비교하고 prompt ensemble을 설명하시오."}]},{"id":"robust","title":"강건성 · SigLIP","subtitle":"원인 · 효율 · 한계","cards":[{"title":"강건성의 원인","html":"<p>Effective robustness는 원래 분포에서의 정확도가 높아 생기는 효과를 감안한 뒤에도 분포 변화에서 얼마나 잘 동작하는지를 보는 개념이다. 강의에서는 데이터 크기, 데이터 분포, 언어 감독, 프롬프트, 대조학습 목표를 통제하여 강건성의 원인을 비교한다.</p><p>그 결과 높은 effective robustness를 설명하는 핵심은 학습 데이터의 분포였다. 동일한 데이터 분포에서는 언어 감독이나 대조 손실을 사용했다는 사실만으로 우수한 강건성이 보장되지 않았다. 따라서 CLIP의 강건성을 단순히 자연어를 사용했기 때문이라고 단정해서는 안 된다.</p>","source":"2강 pp.49–53","question":"CLIP의 높은 effective robustness는 무엇에서 비롯되는가?"},{"title":"데이터 혼합","html":"<p>여러 데이터셋을 혼합한다고 각 데이터셋의 강건성이 단순히 더해지는 것은 아니다. 강의의 실험에서는 혼합 데이터의 effective robustness가 두 데이터 분포의 결과 사이를 보간하는 모습을 보였다.</p><p>예를 들어 YFCC와 LAION의 혼합은 YFCC보다는 높고 LAION보다는 낮은 강건성을 보였다. 데이터 혼합으로 원래 분포의 정확도가 상승하더라도 모든 분포 변화에 대한 성능이 함께 상승한다고 볼 수 없다. 따라서 데이터 규모뿐 아니라 목표 분포에 맞는 데이터 선택과 필터링이 중요하다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">R(YFCC)<br>&lt; R(혼합)<br>&lt; R(LAION)</div>","source":"2강 pp.54–56, 63","question":"이미지–텍스트 데이터를 많이 모아 섞으면 강건성이 항상 향상되는가?"},{"title":"SigLIP 핵심","html":"<p>CLIP은 배치 전체 후보를 softmax로 정규화하여 정답 짝을 선택하지만, SigLIP은 각 이미지–텍스트 쌍이 대응하는지를 sigmoid 기반 이진 손실로 학습한다. 따라서 한 쌍의 손실을 계산할 때 배치 전체 후보에 대한 softmax 분모가 필요하지 않다.</p><p>이러한 쌍별 손실은 분할하거나 장치 사이에서 음성쌍을 교환하며 계산하기 쉬워 메모리와 분산 구현 측면에서 유리하다. 강의에서는 작은 배치에서 좋은 결과와 안정적인 확장 경향을 제시한다. 다만 sigmoid를 쓴다고 음성쌍이 필요 없어지는 것은 아니다.</p>","source":"2강 pp.58–61","question":"SigLIP이 CLIP의 손실을 어떻게 바꾸며 어떤 계산상 이점이 있는지 설명하시오."},{"title":"SigLIP 수식","html":"<p>SigLIP에서 zᵢⱼ는 실제 대응 쌍이면 +1, 비대응 쌍이면 −1로 둔다. 정규화된 이미지와 텍스트 특징의 내적에 학습 가능한 scale t와 bias를 적용하여 쌍의 점수 sᵢⱼ를 얻는다. 여기서는 강의의 부호에 맞추어 sᵢⱼ=tIᵢ·Tⱼ−b로 쓴다.</p><p>각 쌍의 손실 log(1+exp(−zᵢⱼsᵢⱼ))를 줄이면 양성쌍의 점수는 커지고 음성쌍의 점수는 작아진다. 이를 모든 쌍에 대해 합산하여 학습하므로 전역 softmax 없이도 대응 여부를 구별할 수 있다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">z<sub>ij</sub> = +1(짝), −1(비짝)<br>s<sub>ij</sub> = t I<sub>i</sub>·T<sub>j</sub> − b<br><br>L = (1/B) Σ<sub>i,j</sub><br>log[1+exp(−z<sub>ij</sub>s<sub>ij</sub>)]</div>","source":"2강 p.59","question":"SigLIP 손실의 각 기호와 양성·음성쌍에 작용하는 방향을 설명하시오."},{"title":"장점과 한계","html":"<p>CLIP은 이미지와 텍스트를 각각 임베딩한 뒤 저렴한 내적으로 비교하므로 대규모 검색과 학습에 효율적이다. 또한 텍스트로 클래스를 지정할 수 있어 open-vocabulary 인식이 가능하다.</p><p>반면 “풀 속의 컵”과 “컵 속의 풀”처럼 같은 단어를 가지지만 관계가 다른 설명을 구별하는 데에는 한계가 있다. 이를 보완하려면 혼동하기 쉬운 hard negative를 사용하여 관계 차이를 학습시킬 수 있다. 이미지 전체 캡션만으로 부족한 지역 정보는 region caption과 bounding box 감독을 추가하여 보완한다.</p>","source":"2강 pp.69–72","question":"CLIP 계열 모델의 장점과 관계·지역 정보에 관한 한계를 설명하시오."},{"title":"후속 연구 이름","html":"<p>DataComp는 학습법을 바꾸는 것보다 데이터 선택과 필터링 방식이 결과에 미치는 영향을 비교하는 연구이다. 따라서 데이터가 더 크다는 사실만으로 더 좋은 표현을 얻는다고 볼 수 없다는 점을 강조한다.</p><p>Meta CLIP 2는 CLIP의 데이터와 학습을 여러 언어와 세계적 범위로 확장하는 방향이다. Perception Encoder는 잘 조정된 이미지–언어 대조학습으로 범용 시각 특징을 얻을 수 있으며, 좋은 특징이 반드시 최종 출력에만 있는 것이 아니라 중간 층에 존재할 수 있음을 보여 준다.</p>","source":"2강 pp.62–67","question":"DataComp, Meta CLIP 2, Perception Encoder가 개선하려는 방향을 설명하시오."}]},{"id":"prompt","title":"프롬프트 적응","subtitle":"CoOp → MaPLe → FLYP","cards":[{"title":"Engineering / Learning","html":"<p>Prompt engineering은 사람이 자연어 문구를 선택하여 모델의 출력을 유도하는 방법이다. Prompt learning은 문맥을 연속 벡터로 두고 데이터를 이용하여 이 벡터를 최적화하는 방법이므로, 문구를 수작업으로 고르는 부담을 줄일 수 있다.</p><p>Prompt learning에서는 보통 사전학습 backbone의 가중치를 동결하고 추가한 prompt 파라미터만 갱신한다. 가중치를 동결하더라도 연산에 대한 미분은 가능하므로, 손실의 gradient가 backbone을 거쳐 입력 prompt까지 전달될 수 있다. 따라서 backbone을 바꾸지 않고도 과제에 적응할 수 있다.</p>","source":"3강 pp.8–11","question":"Prompt engineering과 prompt learning을 비교하고 frozen backbone에서 학습이 가능한 이유를 설명하시오."},{"title":"CoOp","html":"<p>CoOp는 Context Optimization의 약자로, 클래스 이름 앞의 수작업 문맥을 학습 가능한 연속 context vectors로 대체한다. 클래스 이름은 유지하고 이미지·텍스트 인코더는 동결한 채, 정답 클래스의 이미지–텍스트 유사도가 높아지도록 문맥 벡터를 학습한다.</p><p>이 방법은 적은 라벨 데이터로도 목표 과제에 잘 적응할 수 있지만, 모든 이미지에 공유되는 고정 문맥이 학습한 base 클래스에 특화될 수 있다. 그 결과 같은 데이터셋 안의 보지 못한 novel 클래스에는 일반화 성능이 떨어지는 문제가 있다.</p>","source":"3강 pp.10–18","question":"CoOp의 구조, 학습 대상, 일반화 한계를 설명하시오."},{"title":"CoOp 특징","html":"<p>CoOp는 문맥 길이를 늘리면 더 풍부한 적응이 가능하지만 추가 성능 이득은 점차 감소한다. 또한 학습된 문맥은 연속 벡터이므로 가까운 단어 일부가 관련 의미를 갖더라도 전체가 자연스러운 문장으로 해석되는 것은 아니다.</p><p>도메인 일반화는 학습한 과제를 스케치 등 다른 입력 분포에서 수행하는 능력이고, novel 클래스 일반화는 학습하지 않은 범주를 인식하는 능력이다. 두 변화는 서로 다른 축이므로 CoOp의 도메인 전이 결과가 좋더라도 novel 클래스 과적합 문제가 동시에 존재할 수 있다.</p>","source":"3강 pp.13–18","question":"CoOp에서 prompt 길이와 해석 가능성, 도메인·클래스 일반화의 차이를 설명하시오."},{"title":"CoCoOp","html":"<p>CoCoOp는 고정 문맥을 사용하는 CoOp의 과적합을 줄이기 위해 입력 이미지에 따라 문맥을 조절한다. 이미지 인코더의 특징을 작은 Meta-Net에 넣어 meta-token π를 만들고, 이를 각 기본 context vector에 더하여 이미지별 prompt를 생성한다.</p><p>기본 문맥과 Meta-Net을 학습하며 이미지·텍스트 backbone은 동결한다. 이미지의 구체적 내용에 맞춘 문맥을 사용하여 novel 클래스와 다른 데이터셋에 대한 일반화를 개선한다. 그러나 이미지마다 텍스트 특징이 달라져 재사용하기 어려우므로 파라미터 수가 작아도 학습 연산은 느릴 수 있다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">π = h<sub>θ</sub>(f(x))<br>v<sub>m</sub>(x) = v<sub>m</sub> + π</div>","source":"3강 pp.19–24","question":"CoCoOp는 CoOp의 한계를 어떻게 해결하며 어떤 비용이 발생하는가?"},{"title":"Pixel prompt","html":"<p>Pixel-space visual prompt는 입력 이미지의 픽셀 공간에 학습 가능한 패턴이나 perturbation을 추가하여 사전학습 모델의 예측을 유도하는 방법이다. 모델 가중치를 직접 미세조정하는 대신, 특정 과제에 적합한 공통 입력 패턴을 학습한다.</p><p>학습 시에는 사전학습 인코더를 동결하고 prompt를 최적화한다. 추론 시에는 같은 과제의 모든 테스트 이미지에 동일한 최적화 prompt를 추가한다. 따라서 이미지마다 모델이나 prompt를 새로 학습하는 방식과는 다르다.</p>","source":"3강 pp.30–34","question":"Pixel-space visual prompt의 학습과 추론 과정을 설명하시오."},{"title":"VPT","html":"<p>Visual Prompt Tuning은 ViT의 입력 임베딩 시퀀스에 소수의 학습 가능한 visual prompt tokens를 삽입하여 과제에 적응하는 방법이다. 픽셀 값을 직접 바꾸는 visual prompt와 달리 Transformer가 처리하는 토큰 표현 공간에 정보를 추가한다.</p><p>VPT-Shallow는 첫 번째 층의 입력에만 prompt를 삽입하고, VPT-Deep은 여러 층의 입력에 별도의 prompt를 삽입한다. 두 방식 모두 backbone은 동결하고 prompt와 task head를 학습한다. Deep 방식이라고 해서 backbone 전체의 가중치를 미세조정한다는 뜻은 아니다.</p>","source":"3강 pp.35–36","question":"VPT의 구조와 shallow·deep 방식의 차이를 설명하시오."},{"title":"MaPLe","html":"<p>MaPLe는 텍스트 한쪽만 적응하는 prompt learning의 한계를 줄이기 위해 시각과 언어 양쪽 분기에 계층적인 deep prompts를 삽입한다. 여러 단계에서 두 모달리티가 과제에 맞는 특징을 형성하도록 함께 적응시키는 것이 목적이다.</p><p>이때 두 분기의 prompt를 완전히 독립적으로 학습하지 않고, language prompt를 선형 projection으로 변환하여 vision prompt를 만든다. 따라서 vision prompt는 language prompt에 조건화된다. 사전학습 인코더는 동결하고 prompt와 coupling projection을 학습하므로 기존 지식을 유지하면서 시각·언어의 적응을 연결한다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">P<sub>l</sub><sup>V</sup> = F<sub>l</sub>(P<sub>l</sub><sup>T</sup>)</div>","source":"3강 pp.40–41","question":"MaPLe의 목적과 multimodal deep prompting의 구조를 설명하시오."},{"title":"조건화 방향 비교","html":"<p>CoCoOp는 입력 이미지의 특징으로 meta-token을 생성하여 text context를 조절한다. 즉 조건은 개별 이미지이며, 이미지가 달라지면 텍스트 prompt도 달라진다.</p><p>MaPLe는 language prompt를 coupling function에 통과시켜 vision prompt를 만든다. 즉 language prompt에서 vision prompt로 이어지는 연결을 통해 두 분기의 deep prompting을 정렬한다. 두 방법 모두 backbone 전체를 업데이트한다는 의미가 아니라, 어떤 추가 prompt가 무엇에 의해 정해지는지가 다른 것이다.</p>","source":"3강 pp.20, 41","question":"CoCoOp와 MaPLe에서 조건화의 대상과 방향을 비교하시오."},{"title":"Tip-Adapter","html":"<p>Tip-Adapter는 라벨이 있는 few-shot 이미지의 특징을 key로, 해당 one-hot 라벨을 value로 저장하여 cache를 구성한다. 테스트 이미지 특징을 query로 사용하고 cache의 이미지 특징과 비교하여 유사한 예제의 라벨에 큰 가중치를 준다.</p><p>이렇게 얻은 cache 기반 점수를 기존 CLIP의 분류 점수에 더하여 예측한다. 별도의 gradient 기반 추가 학습 없이 few-shot 정보를 활용하므로 training-free adaptation이라고 한다. 다만 cache를 만들 라벨 데이터는 필요하므로 training-free와 data-free는 다르다.</p>","source":"3강 p.48","question":"Tip-Adapter의 key–value cache와 training-free adaptation을 설명하시오."},{"title":"Tip 수식","html":"<p>Tip-Adapter의 affinity A는 테스트 특징 f와 학습 이미지 특징 F 사이 유사도가 높을수록 큰 값을 갖도록 정의된다. 따라서 테스트 이미지와 가까운 few-shot 예제의 라벨이 AL을 통해 더 강하게 반영된다.</p><p>최종 점수는 αAL과 기존 CLIP logits의 합으로, 전자는 few-shot cache 지식이고 후자는 사전학습 모델의 지식이다. α는 cache가 기여하는 정도를 조절하고 β는 유사도 가중치의 날카로움을 조절한다. 두 정보를 결합하여 모델 가중치를 추가 학습하지 않고 목표 과제에 적응한다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">A = exp[−β(1−fFᵀ)]<br><br>logits = αAL<br>+ 기존 CLIP logits</div>","source":"3강 p.48","question":"Tip-Adapter 수식에서 affinity와 두 점수 항의 역할을 설명하시오."},{"title":"FLYP","html":"<p>일반적인 fine-tuning은 이미지 인코더와 선형 head를 클래스 라벨의 cross-entropy로 학습한다. 그러나 CLIP의 사전학습은 이미지–텍스트 대조학습이므로, 목표가 달라지면 기존 정렬과 분포 밖 일반화가 손상될 수 있다.</p><p>FLYP는 클래스 라벨을 자연어 caption으로 변환하고 이미지·텍스트 인코더 전체를 사전학습과 같은 contrastive objective로 미세조정한다. 핵심은 두 인코더를 학습한다는 사실만이 아니라 미세조정 방식과 목적함수를 사전학습에 맞추는 것이다. 따라서 원래 분포의 정확도 향상만을 목표로 한 일반 fine-tuning과 구분된다.</p>","source":"3강 pp.49–54","question":"FLYP는 일반적인 CLIP fine-tuning과 어떻게 다르며 왜 필요한가?"},{"title":"일반화 평가","html":"<p>Base-to-novel 평가는 한 데이터셋의 base 클래스로 학습한 뒤 같은 데이터셋의 novel 클래스로 일반화하는지를 본다. Cross-dataset transfer는 한 데이터셋에서 적응한 모델을 다른 데이터셋에 직접 적용하며, domain generalization은 스케치 등 입력 분포가 바뀐 환경에서 성능을 평가한다.</p><p>Base와 novel의 균형을 보기 위해 두 정확도의 조화평균 HM=2BN/(B+N)을 사용할 수 있다. 조화평균은 한쪽 성능이 낮을 때 크게 낮아지므로, base 정확도만 높은 모델보다 양쪽에 균형 있게 일반화하는 모델을 평가하는 데 적합하다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">HM = 2BN / (B+N)</div>","source":"3강 pp.43–47 / HM 보충식","question":"Base-to-novel, cross-dataset, domain generalization과 HM을 설명하시오."}]},{"id":"vild","title":"개방형 탐지","subtitle":"ViLD · 손실 · 추론","cards":[{"title":"ViLD의 구조","html":"<p>ViLD는 Vision and Language Knowledge Distillation의 약자로, CLIP의 시각·언어 지식을 객체 탐지기의 영역 표현에 전달하는 방법이다. 객체 위치를 찾는 localization과 범주를 결정하는 classification을 분리한다.</p><p>Class-agnostic proposal은 학습하지 않은 클래스에도 위치 후보를 제공하고, 각 영역의 표현은 클래스의 텍스트 임베딩과 비교하여 분류한다. 따라서 새로운 카테고리를 텍스트로 지정할 수 있으며, 카테고리가 추가될 때마다 탐지기를 다시 학습할 필요를 줄인다.</p>","source":"3강 pp.55–60","question":"ViLD가 open-vocabulary object detection을 수행하는 원리를 설명하시오."},{"title":"ViLD 손실 비교","html":"<p>ViLD-Text는 탐지기의 region embedding과 base 클래스의 text embedding 사이 유사도를 이용하여 정답 범주를 cross-entropy로 학습한다. ViLD-Image는 잘라낸 이미지 영역을 사전학습 이미지 인코더에 넣어 얻은 특징을 teacher로 사용한다.</p><p>탐지기의 region embedding이 이 teacher 특징을 따르도록 L1 distillation loss를 적용하여 시각 지식을 전달한다. 여기서 region embedding에 적용하는 L2는 정규화이며, 이미지 지식을 증류하는 L1 손실과 구별해야 한다. 두 경로를 통해 영역 특징을 시각·언어 공통 공간에 맞춘다.</p>","source":"3강 pp.59–60","question":"ViLD-Text와 ViLD-Image의 학습 방식 및 L1·L2의 차이를 설명하시오."},{"title":"ViLD 추론·평가","html":"<p>추론 시 탐지기는 이미지에서 영역 후보와 region embedding을 얻고, 이를 base와 novel 카테고리의 text embeddings와 비교한다. 새 데이터셋이나 카테고리를 사용하려면 클래스 설명에 해당하는 텍스트 임베딩을 교체하면 된다.</p><p>강의의 LVIS 평가에서는 rare 카테고리를 novel로 남겨 두고 이들에 대한 AP인 APᵣ을 주요 지표로 사용한다. 또한 텍스트에 색이나 속성을 추가하여 기본 범주보다 세밀한 어휘로 영역을 인식할 수 있다. 이는 탐지기를 전혀 학습하지 않는다는 뜻이 아니라, 새로운 범주의 지정 방식을 텍스트로 확장한다는 의미이다.</p>","source":"3강 pp.61–64","question":"ViLD는 novel 카테고리를 어떻게 추론하며 어떻게 평가하는가?"},{"title":"이름만 연결","html":"<p>Learning to Name Classes는 모호하거나 전문적인 클래스 이름이 시각 인식을 방해할 수 있다는 문제를 다룬다. 시각 내용에 맞게 클래스 이름의 표현 자체를 최적화하며, 문맥 벡터를 학습하는 CoOp와 학습 대상이 다르다.</p><p>HPS v2는 text-to-image 모델의 생성 결과에 대한 사람의 선호를 학습하고 예측하기 위한 평가 방식이다. 사람의 이미지 순위 등을 감독으로 사용하므로, 단순히 이미지와 텍스트가 관련 있는지를 측정하는 것을 넘어 인간이 선호하는 결과를 평가하는 것이 목적이다.</p>","source":"3강 pp.25, 65","question":"Learning to Name Classes와 HPS v2가 각각 해결하려는 문제를 설명하시오."}]},{"id":"lm","title":"Transformer","subtitle":"마스크 · 토큰화","cards":[{"title":"Transformer layer","html":"<p>Transformer layer는 attention, feed-forward network, layer normalization, residual connection으로 구성된다. Attention은 입력 위치들 사이의 관계를 이용하여 각 토큰에 필요한 문맥 정보를 결합하고, feed-forward network는 결합된 특징을 변환한다.</p><p>Residual connection은 기존 표현을 더해 정보와 gradient가 전달될 경로를 제공하며, layer normalization은 층의 학습을 안정화한다. Decoder 언어 모델에서는 attention에 causal mask를 추가하여 다음 토큰을 예측할 때 미래의 정답 정보를 볼 수 없게 한다.</p>","source":"4강 pp.6–9","question":"Transformer layer의 구성과 각 요소의 역할을 설명하시오."},{"title":"Causal mask","html":"<p>자기회귀 언어 모델은 현재까지 주어진 토큰만으로 다음 토큰을 예측해야 하므로 미래 위치의 정보를 사용하면 정답 누출이 발생한다. 이를 막기 위해 attention score에서 미래 위치에 −∞를 더한다.</p><p>Softmax를 적용하면 exp(−∞)=0이므로 해당 위치의 attention weight가 0이 된다. 반면 score를 단순히 0으로 두면 exp(0)=1이어서 미래 위치의 정보가 여전히 반영될 수 있다. 이러한 mask 덕분에 여러 위치의 학습을 병렬로 계산하면서도 인과적 조건을 지킬 수 있다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">A = softmax(QKᵀ/√d<sub>k</sub> + M)V<br><br>M<sub>ij</sub> = 0 (j≤i)<br>M<sub>ij</sub> = −∞ (j&gt;i)</div>","source":"4강 p.9 / attention 표준식 보충","question":"Causal attention에서 미래 위치를 −∞로 마스킹하는 이유를 설명하시오."},{"title":"Autoregressive","html":"<p>Autoregressive language modeling은 전체 시퀀스 확률을 각 토큰이 앞선 토큰들에 조건화된 확률의 곱으로 분해하는 방식이다. 생성할 때에는 다음 토큰 분포에서 하나를 선택하고 문맥에 추가하는 과정을 반복한다.</p><p>학습은 causal mask를 이용하여 여러 위치를 병렬로 계산할 수 있지만, 생성은 앞서 선택한 토큰이 다음 입력이 되므로 순차적으로 진행된다. Decoding은 이 과정에서 토큰 후보를 선택하는 탐색이며, 매 단계 가장 높은 확률을 고르는 greedy 방법이 전체 문장 확률의 최댓값을 보장하지는 않는다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">p(x<sub>1:T</sub>)<br>= ∏<sub>t</sub> p(x<sub>t</sub>|x<sub>&lt;t</sub>)</div>","source":"4강 pp.10–13","question":"Autoregressive language modeling과 decoding의 의미를 설명하시오."},{"title":"ID vs embedding","html":"<p>Tokenizer는 문자열을 토큰으로 나누고 vocabulary의 정수 인덱스인 token ID로 변환한다. Token ID 자체가 의미 벡터는 아니며, embedding matrix에서 해당 항목을 조회하여 연속 벡터를 얻은 뒤 언어 모델에 입력한다.</p><p>강의의 열 기준 표기에서 embedding matrix는 d×|V| 크기이므로 파라미터 수는 d|V|이다. 따라서 어휘 수가 커지면 입력 시퀀스가 짧아질 수 있지만 embedding 파라미터와 어휘 관리 부담은 증가한다. 토큰화는 전처리이면서도 모델의 표현과 계산 효율에 영향을 준다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">E ∈ ℝ<sup>d × |V|</sup><br>파라미터 = d|V|</div>","source":"4강 pp.15–24","question":"Token ID와 embedding의 차이, vocabulary 크기의 영향을 설명하시오."},{"title":"토큰화 절충","html":"<p>Word tokenization은 의미가 직관적이고 시퀀스가 비교적 짧지만, 모든 단어를 다루려면 어휘가 커지고 희귀어와 신조어에 취약하다. Zipf 법칙에 따르면 단어 빈도는 대략 순위에 반비례하므로 빈도가 낮은 단어의 긴 꼬리가 존재한다.</p><p>Character tokenization은 다양한 단어를 문자 조합으로 표현할 수 있지만 시퀀스가 길어진다. Subword tokenization은 자주 나타나는 단어 또는 단어 일부를 토큰으로 사용하여 단어 수준의 효율과 문자 수준의 coverage를 절충한다. 이때 데이터 통계로 정한 subword 경계가 항상 언어학적 형태소 경계와 일치하는 것은 아니다.</p>","source":"4강 pp.25–27","question":"Word·character·subword tokenization의 절충과 Zipf 법칙의 관련성을 설명하시오."}]},{"id":"llava","title":"MLLM · LLaVA","subtitle":"데이터 · 특징 · 학습","cards":[{"title":"MLLM 3요소","html":"<p>MLLM은 시각 데이터를 이해하고 이를 바탕으로 자연어로 응답하는 멀티모달 대규모 언어 모델이다. 일반적인 구조는 vision encoder, cross-modal connector, language model로 이루어진다.</p><p>Vision encoder는 이미지에서 특징을 추출하고 connector는 이를 언어 모델이 처리할 수 있는 임베딩 공간으로 변환한다. 언어 모델은 시각 토큰과 텍스트 instruction을 함께 조건으로 받아 답변을 생성한다. 기존의 강한 사전학습 모델을 재사용하고 visual instruction 데이터로 적응시키는 것이 효율적인 구축 방식이다.</p>","source":"4강 pp.30–33, 55","question":"MLLM의 기본 구조와 각 모듈의 역할을 설명하시오."},{"title":"합성 instruction","html":"<p>Text-only GPT는 원시 이미지를 직접 볼 수 없으므로 이미지의 정보를 텍스트 형태로 제공해야 한다. LLaVA의 데이터 생성에서는 이미지 캡션과 객체 범주, bounding box 등의 정보를 context로 사용한다.</p><p>GPT가 이 context와 seed 예시를 참고하여 이미지에 관한 instruction과 답변을 생성하도록 하고, 생성 결과를 원래 이미지와 결합하여 image–instruction–answer triplet을 만든다. 이를 통해 사람이 모든 지시와 답을 직접 작성하는 비용을 줄이면서 시각적 지시 이행 데이터를 확보할 수 있다.</p>","source":"4강 pp.40–43","question":"Text-only GPT를 이용해 visual instruction 데이터를 만드는 방법을 설명하시오."},{"title":"왜 instruction tuning?","html":"<p>Next-token 사전학습은 주어진 텍스트 뒤에 올 토큰을 예측하도록 학습하므로 언어 지식과 문장 생성 능력을 얻는 데 유용하다. 그러나 문장을 그럴듯하게 이어 쓰는 목적과 사용자의 지시를 이해하여 원하는 답을 제공하는 목적은 완전히 같지 않다.</p><p>Instruction tuning은 instruction과 이에 적절한 output의 예시를 이용하여 모델을 지시 이행에 적응시키는 과정이다. MLLM에서는 이미지까지 포함된 instruction 데이터를 사용함으로써 시각 정보를 활용하여 질문에 답하거나 요구된 설명을 생성하도록 학습한다.</p>","source":"4강 pp.35–39","question":"대규모 next-token 사전학습 이후에도 instruction tuning이 필요한 이유를 설명하시오."},{"title":"Penultimate patch","html":"<p>CLIP의 최종 CLS 특징은 이미지 전체를 텍스트와 정렬하도록 학습된 전역 요약이므로 세밀한 위치와 공간 정보를 충분히 전달하지 못할 수 있다. 또한 최종 층의 patch outputs는 최종 CLS를 통한 대조 손실의 직접 출력으로 감독되지 않는다.</p><p>LLaVA는 끝에서 두 번째 층의 여러 patch features를 사용하여 공간적·세부적인 시각 정보를 언어 모델에 전달한다. 이 특징을 projector로 언어 모델의 입력 공간에 맞추어 사용한다. 이는 CLIP의 patch가 전혀 학습되지 않았다는 뜻이 아니라 최종 출력 특징의 감독 방식과 용도에 차이가 있다는 의미이다.</p>","source":"4강 pp.49–55","question":"LLaVA가 최종 CLS 대신 penultimate layer의 patch features를 사용하는 이유를 설명하시오."},{"title":"Projector · Stage 1","html":"<p>Projector는 vision encoder가 만든 특징을 언어 모델의 입력 임베딩 공간에 연결하는 모듈이다. 초기 LLaVA는 선형 층을 사용하며 LLaVA-1.5에서는 MLP를 사용한다.</p><p>Stage 1의 목적은 사전학습된 시각 특징을 언어 모델이 활용할 수 있도록 feature alignment를 학습하는 것이다. 약 595K 이미지–텍스트 쌍을 사용하고 vision encoder와 LLM을 동결한 채 projector만 학습한다. 이를 통해 기존 시각·언어 지식을 크게 바꾸지 않고 두 모듈 사이의 연결을 먼저 맞춘다.</p>","source":"4강 pp.55–56","question":"LLaVA의 projector와 Stage 1 feature alignment를 설명하시오."},{"title":"Stage 2","html":"<p>Stage 2는 시각 정보에 관한 사용자의 instruction을 따르도록 적응시키는 visual instruction tuning 단계이다. 대화, 상세 설명, 복잡한 추론으로 구성된 LLaVA-Instruct-158K 데이터를 사용한다.</p><p>Stage 1이 projector만 학습하는 것과 달리, Stage 2는 projector와 LLM을 함께 학습한다. 그러나 vision encoder는 계속 동결한다. 따라서 강의의 “end-to-end”라는 표현을 모든 모듈, 특히 vision encoder까지 갱신한다는 의미로 해석하면 안 된다.</p>","source":"4강 pp.43, 57","question":"LLaVA Stage 2의 목적과 Stage 1과의 학습 대상 차이를 설명하시오."},{"title":"LLaVA 손실","html":"<p>LLaVA는 이미지와 텍스트 instruction, 그리고 앞서 주어진 답변 토큰들을 조건으로 다음 답변 토큰을 예측한다. 정답 답변 토큰의 조건부 확률에 대한 음의 로그를 합하여 autoregressive language loss를 계산한다.</p><p>시각 토큰은 언어 답변을 생성하기 위한 조건으로 사용되며, 이 손실의 핵심 예측 대상은 답변의 언어 토큰이다. 따라서 이미지 패치를 복원하는 손실이나 CLIP의 이미지–텍스트 짝 맞추기 손실과 구분해야 한다. 모듈별 학습 여부는 단계에 따라 달라도 답변 생성이라는 학습 목표는 유지된다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">L = −Σ<sub>t</sub> log p(a<sub>t</sub> |<br>image, instruction, a<sub>&lt;t</sub>)</div>","source":"4강 pp.54–57","question":"LLaVA의 학습 손실에서 무엇을 조건으로 무엇을 예측하는지 설명하시오."}]},{"id":"vision","title":"시각 개선","subtitle":"Encoder · 토큰 · SoM","cards":[{"title":"Vision의 3문제","html":"<p>MLLM의 시각 처리에는 어떤 vision encoder를 사용할지, 많은 visual tokens를 어떻게 처리할지, 이미지에 대한 지시를 어떻게 제공할지라는 세 문제가 있다. 이들은 각각 visual tokenizer, token 비용, visual prompting의 문제에 해당한다.</p><p>강의의 이해 과제 비교에서는 이미지–언어로 사전학습한 CLIP과 SigLIP이 유리한 결과를 보였다. 언어와 관련된 의미 표현을 이미 학습했기 때문이다. 다만 특정 실험에서의 단독 성능이 모든 과제에서의 우월성이나 세부 지각의 완전함을 의미하지는 않는다.</p>","source":"4강 pp.61–70","question":"MLLM에서 시각 처리를 설계할 때의 세 가지 문제와 encoder 선택 기준을 설명하시오."},{"title":"고해상도 · VCoder","html":"<p>고해상도 이미지는 여러 local crop으로 나누어 고정 크기 vision encoder에 각각 입력할 수 있다. 여기에 전체 이미지를 축소한 global 표현을 함께 사용하면 작은 문자나 객체의 세부 정보와 전체 문맥을 모두 전달할 수 있다.</p><p>LLaVA-NeXT의 예에서는 visual tokens가 576개에서 최대 2880개로 늘어나며, 세부 인식 개선 대신 계산 비용이 증가한다. VCoder는 segmentation이나 depth 같은 추가 지각 모달리티를 입력하여 시각 이해를 보완한다. 언어로 상세한 설명을 잘하는 것만으로 수 세기 같은 지각 능력이 보장되지는 않는다.</p>","source":"4강 pp.71–73","question":"고정 크기 vision encoder에서 고해상도 이미지를 처리하는 방법과 VCoder를 설명하시오."},{"title":"CLIP-blind pair","html":"<p>CLIP-blind pair는 CLIP의 이미지 간 cosine similarity는 0.95보다 높지만 DINOv2의 similarity는 0.6보다 낮은 이미지 쌍이다. CLIP은 거의 같다고 표현하지만 다른 시각 모델은 차이를 포착한다는 점에서 CLIP이 놓치는 시각 차이를 진단하는 데 사용한다.</p><p>이러한 쌍의 차이를 묻는 질문으로 MMVP benchmark를 구성하여 멀티모달 모델의 시각적 한계를 평가한다. CLIP은 범주나 의미를 잘 표현하더라도 방향, 수량, 공간 배치처럼 세밀한 시각 정보를 구별하지 못할 수 있다는 점이 핵심이다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">CLIP cosine &gt; 0.95<br>DINOv2 cosine &lt; 0.6</div>","source":"4강 pp.74–76","question":"CLIP-blind pair의 정의와 MMVP의 목적을 설명하시오."},{"title":"MoF","html":"<p>Mixture-of-Features는 서로 다른 vision encoder가 추출한 특징을 결합하여 상보적인 정보를 활용하는 방법이다. CLIP이 의미적 범주를 잘 표현하는 반면 DINOv2는 CLIP이 놓치는 세부 차이를 보존할 수 있으므로 함께 사용하면 지각을 보완할 수 있다.</p><p>강의에서는 additive 방식과 interleaved 방식의 MoF를 소개하며 I-MoF를 통한 세부 포착 개선을 제시한다. DINOv2의 단독 이해 점수가 더 낮더라도 CLIP과 다른 정보를 제공한다면 혼합에서는 유용할 수 있다. 따라서 단독 성능과 앙상블의 기여도는 구분해야 한다.</p>","source":"4강 pp.77–78","question":"Mixture-of-Features가 CLIP의 시각적 한계를 보완할 수 있는 이유를 설명하시오."},{"title":"토큰 비용","html":"<p>이미지는 한 장만으로도 수백에서 수천 개의 visual tokens를 만들며, 영상은 프레임마다 토큰이 누적된다. 이 토큰들이 텍스트와 함께 언어 모델에 입력되면 전체 시퀀스 길이가 크게 증가한다.</p><p>일반적인 self-attention의 계산과 메모리 부담에는 시퀀스 길이 L의 제곱에 비례하는 항이 있으므로 토큰 증가의 비용이 크다. 따라서 중복된 시각 정보를 줄이되 답변에 필요한 객체와 공간 정보를 보존하는 압축·선별 방법이 필요하다. 토큰 감소 비율이 전체 추론 시간의 동일한 감소 비율을 뜻하는 것은 아니다.</p><div class=\"formula-label\">답안에 함께 쓸 수식</div><div class=\"math\">Self-attention O(L²)</div>","source":"4강 pp.79–82","question":"MLLM에서 visual token 수가 계산 병목이 되는 이유를 설명하시오."},{"title":"Q-Former vs concat","html":"<p>Q-Former는 정해진 수의 학습 가능한 query가 visual embeddings에서 필요한 정보를 읽어 소수의 출력 토큰으로 요약하는 방식이다. Query 수를 통해 언어 모델에 전달할 시각 토큰 수를 조절할 수 있다.</p><p>Concatenate-then-projection은 공간적으로 인접한 네 개의 토큰을 이어 붙인 뒤 projection으로 한 토큰으로 변환한다. 전자는 query를 통해 정보를 선택적으로 읽는 방식이고, 후자는 고정된 공간 이웃의 표현을 묶어 압축한다는 차이가 있다.</p>","source":"4강 p.80","question":"Q-Former와 concatenate-then-projection의 토큰 압축 원리를 비교하시오."},{"title":"PruMerge","html":"<p>PruMerge는 시각 토큰의 공간적 중복을 이용하여 토큰 수를 적응적으로 줄이는 방법이다. 먼저 중요한 토큰을 선택하고, k-nearest neighbor로 관련 토큰을 군집화한 뒤, 각 군집의 가중 평균으로 선택된 토큰을 보정한다.</p><p>따라서 중요한 토큰만 남기고 나머지를 단순히 버리는 것이 아니라 주변 정보를 대표 토큰에 병합한다. 강의에서는 원래 visual tokens의 25%만 사용하면서 경쟁력 있는 성능을 보였다. 이는 25% 감소가 아니라 75% 감소이며, 다른 연산 비용도 존재하므로 전체 속도가 반드시 같은 비율로 개선된다는 뜻은 아니다.</p>","source":"4강 pp.81–82","question":"PruMerge의 세 단계와 “25% tokens” 결과의 의미를 설명하시오."},{"title":"UI graph","html":"<p>GUI는 자연 이미지와 달리 구조화된 배치와 반복 요소, 큰 배경 영역을 포함하므로 중복 토큰을 줄일 여지가 있다. ShowUI는 RGB 공간의 patch-wise UI graph를 이용하여 이러한 중복을 파악하고 토큰을 선별한다.</p><p>GUI agent는 객체를 설명하는 데 그치지 않고 실제 클릭이나 입력 위치를 결정해야 하므로 원래 위치 관계를 보존하는 것이 중요하다. 강의는 UI-graph 기반 token selection을 강조하며 merging에는 취소선을 표시한다. 따라서 일반적인 특징 병합과 동일하게 설명하기보다 행동을 위한 위치 보존을 핵심으로 제시해야 한다.</p>","source":"4강 pp.83–86","question":"GUI agent에서 UI graph 기반 token selection과 위치 보존이 중요한 이유를 설명하시오."},{"title":"SoM 두 조건","html":"<p>Set-of-Mark prompting은 이미지를 의미 있는 영역으로 나누고 번호, 문자, 마스크, 박스 등의 표식을 붙여 모델이 특정 영역을 정확히 지칭하도록 하는 방법이다. 텍스트에서 단계별로 생각하게 하듯 시각적으로는 위치별로 대상을 살펴보도록 돕는다.</p><p>첫 번째 조건은 영역이 의미 있게 분할되어 시각 대상과 텍스트 출력 사이의 grounding이 가능해야 한다는 것이다. 두 번째 조건은 추가한 표식이 모델에게 해석 가능하고 “3번 객체”처럼 언어로 참조할 수 있어야 한다는 것이다. 핵심은 입력 이미지의 표시 방식이며 모델 가중치의 추가 학습이 아니다.</p>","source":"4강 pp.90–92","question":"Set-of-Mark prompting의 목적과 작동하기 위한 두 조건을 설명하시오."},{"title":"SoM 생성 순서","html":"<p>SoM의 image partition은 영역을 정확히 나누면서 다양한 시각 개념을 다룰 수 있어야 하며, 객체 전체뿐 아니라 객체의 부분까지 여러 세밀함의 영역을 제공해야 한다. 강의에서는 SEEM, Semantic-SAM, SAM과 자동·상호작용 방식을 소개한다.</p><p>Mark generation에서는 번호, 문자, 마스크, 박스 등 언어로 참조 가능한 표식을 사용한다. 작은 영역부터 큰 영역 순서로 overlay하고, 새 표식을 넣을 때 이미 표시한 영역은 제외하여 작은 대상의 표식이 덮이지 않도록 한다. 이를 통해 대상과 표식의 대응을 유지하여 더 정확한 시각 grounding을 돕는다.</p>","source":"4강 pp.93–94","question":"SoM의 image partition과 mark generation에서 고려해야 할 사항을 설명하시오."}]}];const flat=DATA.flatMap((g,gi)=>g.cards.map((c,ci)=>({...c,gi,ci,id:g.id+'-'+ci})));let screen='home',gi=0,ci=0;let favorites=[],font=15,last=null;
try{favorites=JSON.parse(localStorage.getItem('mmw-stars')||'[]');font=Number(localStorage.getItem('mmw-font'))||15;last=JSON.parse(localStorage.getItem('mmw-last')||'null')}catch(e){}font=[15,17,19].includes(font)?font:15;document.documentElement.style.setProperty('--text',font+'px');
const main=document.getElementById('screen'),counter=document.getElementById('counter'),star=document.getElementById('star'),nav=document.getElementById('nav'),back=document.getElementById('back');
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

if(screen==='home'){counter.textContent='서술형 · '+flat.length;main.innerHTML='<h2>멀티모달 AI</h2><p class="intro">주제 터치 · 개념 문제별 답안</p>'+(last&&DATA[last.gi]?.cards[last.ci]?row('이어보기',esc(DATA[last.gi].title+' · '+DATA[last.gi].cards[last.ci].title),'resume','primary'):'')+DATA.map((g,i)=>row('<span class="count">'+g.cards.length+'</span>'+esc(g.title),esc(g.subtitle),'group:'+i)).join('')+row('★ 즐겨찾기',favorites.length+'개 저장','favorites')+'<p class="hint">글자 크기: '+font+'px<br>왼쪽 위 ‘글자’를 눌러 조절<br>수식은 터치하면 확대됩니다.</p><p class="source">박관용 멀티모달 AI 1–4강<br>기존 단일 페이퍼 기반 요약</p>';nav.innerHTML='';
}else if(screen==='group'){const g=DATA[gi];counter.textContent=g.cards.length+'개';main.innerHTML='<div class="eyebrow">주제 목차</div><h2>'+esc(g.title)+'</h2>'+g.cards.map((c,i)=>row((favorites.includes(g.id+'-'+i)?'★ ':'')+esc(c.title),'','card:'+gi+':'+i,'item')).join('');nav.innerHTML='<button class="label" data-action="home">전체 목차</button>';

main.querySelectorAll('.math').forEach(m=>{m.setAttribute('role','button');m.setAttribute('tabindex','0');m.setAttribute('aria-label','수식 확대 또는 축소');m.onclick=()=>m.classList.toggle('large');m.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();m.click()}}});}
function openCard(g,c){gi=g;ci=c;screen='card';render()}function move(delta){if(screen!=='card')return;const n=flat.findIndex(c=>c.id===cardId())+delta;if(n>=0&&n<flat.length)openCard(flat[n].gi,flat[n].ci)}function changeFont(){font=font===15?17:font===17?19:15;document.documentElement.style.setProperty('--text',font+'px');save('mmw-font',font);if(screen==='home')render();}
function act(a){const p=a.split(':');if(p[0]==='group'){gi=+p[1];screen='group';render()}else if(p[0]==='card')openCard(+p[1],+p[2]);else if(a==='resume'&&last)openCard(last.gi,last.ci);else if(a==='home'){screen='home';render()}else if(a==='favorites'){screen='favorites';render()}else if(a==='prev')move(-1);else if(a==='next')move(1);else if(a==='font')changeFont()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action)});back.onclick=()=>{if(screen==='home')changeFont();else if(screen==='card'){screen='group';render()}else{screen='home';render()}};star.onclick=()=>{if(screen!=='card')return;const id=cardId();favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('mmw-stars',favorites);star.textContent=favorites.includes(id)?'★':'☆';star.setAttribute('aria-pressed',favorites.includes(id))};
let touch=null;main.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY,interactive:!!e.target.closest('button,.math')};else touch=null},{passive:true});main.addEventListener('touchend',e=>{if(!touch||touch.interactive||screen!=='card')return;const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y;touch=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.8)move(dx<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);else if(e.key==='Escape')back.click()});render();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
